name: dingo
version: 0.80.0
description: Dingo Cardano node software by Blink Labs
dependencies:
  - cardano-config >= 20251128
  - cardano-cli >= 10.12.0.0
installSteps:
  - file:
      binary: true
      filename: dingo
      url: 'https://github.com/blinklabs-io/dingo/releases/download/v{{ .Package.Version }}/dingo-v{{ .Package.Version }}-{{ .System.OS }}-{{ .System.ARCH }}.tar.gz'
      archive: tar.gz
      archivePath: dingo
  - file:
      binary: true
      filename: .nview-bin
      url: 'https://github.com/blinklabs-io/nview/releases/download/v0.15.0/nview-v0.15.0-{{ .System.OS }}-{{ .System.ARCH }}'
  - file:
      binary: true
      filename: dingo-nview
      content: |
        #!/usr/bin/env bash
        export CARDANO_NETWORK="${CARDANO_NETWORK:-{{ .Context.Network }}}"
        export CARDANO_NODE_BINARY="${CARDANO_NODE_BINARY:-dingo}"
        exec "{{ .Paths.DataDir }}/.nview-bin" "${@}"
  - file:
      binary: true
      filename: .txtop-bin
      url: 'https://github.com/blinklabs-io/txtop/releases/download/v0.16.0/txtop-v0.16.0-{{ .System.OS }}-{{ .System.ARCH }}'
  - file:
      binary: true
      filename: dingo-txtop
      content: |
        #!/usr/bin/env bash
        export CARDANO_NETWORK="${CARDANO_NETWORK:-{{ .Context.Network }}}"
        export CARDANO_NODE_SOCKET_PATH="${CARDANO_NODE_SOCKET_PATH:-{{ .Paths.ContextDir }}/node-ipc/dingo.socket}"
        exec "{{ .Paths.DataDir }}/.txtop-bin" "${@}"
outputs:
  - name: blockfrost
    description: Dingo Blockfrost-compatible REST API
    value: 'http://localhost:3000'
  - name: grpc
    description: Dingo gRPC service
    value: 'http://localhost:9090'
  - name: mesh
    description: Dingo Mesh (Rosetta) REST API
    value: 'http://localhost:8080'
  - name: relay
    description: Dingo Ouroboros Node-to-Node service
    value: 'localhost:3001'
  - name: socket-path
    description: Path to the Dingo Ouroboros Node-to-Client UNIX socket
    value: '{{ .Paths.ContextDir }}/node-ipc/dingo.socket'
  - name: socket-port
    description: Dingo Ouroboros Node-to-Client service over TCP
    value: 'localhost:3002'
postStartScript: |
  set -e
  mkdir -p "{{ .Paths.ContextDir }}/config/{{ .Context.Network }}" "{{ .Paths.ContextDir }}/node-ipc" "{{ .Paths.ContextDir }}/dingo-data"
  _pid_file="{{ .Paths.ContextDir }}/dingo.pid"
  if [ -f "${_pid_file}" ] && kill -0 "$(cat "${_pid_file}")" 2>/dev/null; then
    echo "dingo is already running"
  else
    export CARDANO_CONFIG="{{ .Paths.ContextDir }}/config/{{ .Context.Network }}/config.json"
    export CARDANO_NETWORK="{{ .Context.Network }}"
    export CARDANO_DATABASE_PATH="{{ .Paths.ContextDir }}/dingo-data"
    export CARDANO_SOCKET_PATH="{{ .Paths.ContextDir }}/node-ipc/dingo.socket"
    export CARDANO_PRIVATE_BIND_ADDR="0.0.0.0"
    export DINGO_STORAGE_MODE="api"
    export DINGO_BLOCKFROST_PORT="3000"
    export DINGO_MESH_PORT="8080"
    export DINGO_UTXORPC_PORT="9090"
    nohup "{{ .Paths.DataDir }}/dingo" serve >> "{{ .Paths.ContextDir }}/dingo.log" 2>&1 &
    echo $! > "${_pid_file}"
  fi
preStopScript: |
  _pid_file="{{ .Paths.ContextDir }}/dingo.pid"
  if [ -f "${_pid_file}" ]; then
    _pid="$(cat "${_pid_file}")"
    if kill -0 "${_pid}" 2>/dev/null; then
      kill -TERM "${_pid}" 2>/dev/null || true
      _waited=0
      while kill -0 "${_pid}" 2>/dev/null && [ "${_waited}" -lt 30 ]; do
        sleep 1
        _waited=$((_waited + 1))
      done
      kill -0 "${_pid}" 2>/dev/null && kill -KILL "${_pid}" 2>/dev/null || true
    fi
    rm -f "${_pid_file}"
  fi
tags:
  - linux
  - amd64
  - arm64
